services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    env_file: ../.env
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    restart: unless-stopped
    env_file: ../.env
    environment: { NODE_ENV: production }
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    restart: unless-stopped
    env_file: ../.env
    environment: { NODE_ENV: production }
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 90s
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
